# Estrutura plana (index.html, app.js, style.css na raiz do repo)
[build]
  publish = "."
  command = "echo 'WEB MSN static'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
